<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fake Friend Test 💗</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #fff, #ffe6f0);
  display: flex;
  justify-content: center;
  align-items: center;
  color: #333;
}

.game {
  width: 92%;
  max-width: 500px;
  background: white;
  border-radius: 25px;
  padding: 28px 22px;
  box-shadow: 0 10px 35px rgba(0,0,0,.12);
  text-align: center;
}

h1 {
  color: #ff5c91;
  margin-bottom: 8px;
}

.subtitle {
  color: #777;
  margin-bottom: 25px;
}

.question {
  font-size: 20px;
  font-weight: bold;
  margin: 20px 0;
}

.option {
  width: 100%;
  padding: 14px;
  margin: 9px 0;
  border: 2px solid #ffd0df;
  background: #fff7fa;
  border-radius: 15px;
  cursor: pointer;
  font-size: 16px;
  transition: .2s;
}

.option:hover {
  background: #ffe1ec;
  transform: scale(1.02);
}

.option.selected {
  background: #ff80a8;
  color: white;
  border-color: #ff80a8;
}

button {
  border: none;
  background: #ff5c91;
  color: white;
  padding: 14px 30px;
  border-radius: 30px;
  font-size: 17px;
  cursor: pointer;
  margin-top: 20px;
}

button:hover {
  background: #ff3978;
}

.progress {
  font-size: 13px;
  color: #999;
}

.result {
  display: none;
}

.score {
  font-size: 45px;
  font-weight: bold;
  color: #ff5c91;
  margin: 20px;
}

.message {
  font-size: 18px;
  line-height: 1.5;
}

.restart {
  margin-top: 20px;
}
</style>
</head>

<body>

<div class="game">

  <div id="quiz">
    <h1>💗 Fake Friend Test 💗</h1>
    <p class="subtitle">Let's see how well you REALLY know me 👀</p>

    <div class="progress" id="progress"></div>

    <div class="question" id="question"></div>

    <div id="options"></div>

    <button onclick="nextQuestion()">Next 💕</button>
  </div>

  <div class="result" id="result">
    <h1>💌 Your Result</h1>

    <div class="score" id="score"></div>

    <div class="message" id="message"></div>

    <button class="restart" onclick="location.reload()">
      Try Again 🔄
    </button>
  </div>

</div>

<script>

const questions = [

  {
    q: "What's my favorite color? 🤍",
    options: ["Pink 💗", "White 🤍", "Black 🖤", "Purple 💜"],
    answer: "White 🤍"
  },

  {
    q: "What's my favorite food? 🍍",
    options: ["Momo 🥟", "Pizza 🍕", "Pineapple 🍍", "Fried rice 🍚"],
    answer: "Pineapple 🍍"
  },

  {
    q: "What's my favorite animal? 🦢",
    options: ["Cat 🐱", "Dog 🐶", "Swan 🦢", "Rabbit 🐰"],
    answer: "Swan 🦢"
  },

  {
    q: "What's my dream job? 💻",
    options: ["Nurse 🩺", "Developer 💻", "Teacher 📚", "Doctor 🩻"],
    answer: "Developer 💻"
  },

  {
    q: "Which season do I like most? 🌸",
    options: ["Summer ☀️", "Winter ❄️", "Spring 🌸", "Autumn 🍂"],
    answer: "Spring 🌸"
  },

  {
    q: "What's my biggest fear? 💔",
    options: ["Heights 😭", "Darkness 🌑", "Losing someone 💔", "Insects 🐛"],
    answer: "Losing someone 💔"
  },

  {
    q: "What makes me happiest? 🫶",
    options: [
      "Getting gifts 🎁",
      "Spending time with someone I love 🫶",
      "Sleeping 😴",
      "Eating 🍕"
    ],
    answer: "Spending time with someone I love 🫶"
  },

  {
    q: "What annoys me the most? 😤",
    options: ["Lying 🤥", "Noise 🔊", "Rain 🌧️", "Being late ⏰"],
    answer: "Lying 🤥"
  },

  {
    q: "What's my personality like? 😂",
    options: [
      "Quiet & shy 🌷",
      "Funny & chaotic 😂",
      "Rude and kind 😭😂",
      "Calm & serious 🤍"
    ],
    answer: "Rude and kind 😭😂"
  },

  {
    q: "What do I value most? 🤍",
    options: ["Money 💰", "Fame ⭐", "Honesty 🤍", "Popularity 👑"],
    answer: "Honesty 🤍"
  },

  {
    q: "What's my perfect day? ✈️",
    options: [
      "Staying home 🛏️",
      "Traveling ✈️",
      "Shopping 🛍️",
      "Sleeping 😴"
    ],
    answer: "Traveling ✈️"
  },

  {
    q: "What kind of person do I dislike most? 🤥",
    options: [
      "Shy people 🌷",
      "Liars 🤥",
      "Quiet people 🤫",
      "Funny people 😂"
    ],
    answer: "Liars 🤥"
  }

];

let current = 0;
let score = 0;
let selected = null;

function loadQuestion() {

  selected = null;

  const q = questions[current];

  document.getElementById("progress").innerText =
    `Question ${current + 1} / ${questions.length}`;

  document.getElementById("question").innerText = q.q;

  const optionsDiv = document.getElementById("options");
  optionsDiv.innerHTML = "";

  q.options.forEach(option => {

    const btn = document.createElement("button");

    btn.className = "option";
    btn.innerText = option;

    btn.onclick = () => {

      selected = option;

      document.querySelectorAll(".option")
        .forEach(x => x.classList.remove("selected"));

      btn.classList.add("selected");
    };

    optionsDiv.appendChild(btn);
  });
}

function nextQuestion() {

  if (selected === null) {
    alert("Choose an answer first 💗");
    return;
  }

  if (selected === questions[current].answer) {
    score++;
  }

  current++;

  if (current < questions.length) {
    loadQuestion();
  } else {
    showResult();
  }
}

function showResult() {

  document.getElementById("quiz").style.display = "none";
  document.getElementById("result").style.display = "block";

  document.getElementById("score").innerText =
    `${score}/${questions.length}`;

  let message = "";

  if (score === 12) {
    message = "OMG 😭💗 YOU KNOW ME TOO WELL! You're definitely a REAL ONE! 🫶";
  } 
  else if (score >= 9) {
    message = "Okayyy 👀💗 You actually know me pretty well!";
  } 
  else if (score >= 6) {
    message = "Hmmmm... you're halfway there 😭😂 Maybe study me more!";
  } 
  else if (score >= 3) {
    message = "FAKE FRIEND ALERT 🚨😭 You need to know me better!";
  } 
  else {
    message = "WHO ARE YOU?! 😭💀 This is officially a FAKE FRIEND!";
  }

  document.getElementById("message").innerText = message;
}

loadQuestion();

</script>

</body>
</html>
